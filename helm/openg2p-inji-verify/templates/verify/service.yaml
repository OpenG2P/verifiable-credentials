{{- if .Values.verifyService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "verify.fullname" . }}
  labels: {{- include "verify.labels" . | nindent 4 }}
spec:
  type: {{ .Values.verifyService.service.type }}
  ports:
    - port: {{ .Values.verifyService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector: {{- include "verify.selectorLabels" . | nindent 4 }}
{{- end }}
