{{- if and .Values.verifyService.enabled .Values.global.istio.enabled (not .Values.global.istio.gateway.name) }}
{{- $host := include "common.tplvalues.render" (dict "value" .Values.verifyService.hostname "context" .) }}
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: {{ include "verify.fullname" . }}-gateway
  labels: {{- include "verify.labels" . | nindent 4 }}
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        name: http2
        number: 8080
        protocol: HTTP2
      hosts:
        - {{ $host | quote }}
    {{- if .Values.global.istio.gateway.httpsEnabled }}
    - port:
        name: https
        number: 8443
        protocol: HTTPS
      hosts:
        - {{ $host | quote }}
      tls: {{- toYaml .Values.global.istio.gateway.tls | nindent 8 }}
    {{- end }}
{{- end }}
