questions:

# ── General ─────────────────────────────────────────────────────────────────
- variable: certify.enabled
  description: Install the Inji Certify service
  type: boolean
  label: Inji Certify Service
  default: true
  group: General

- variable: global.certifyHostname
  description: Hostname under which Certify is accessed (e.g. certify.example.org)
  type: string
  label: Certify Hostname
  group: General

- variable: global.certifyDomainUrl
  description: >-
    Public base URL of Certify — used as the token issuer, JWKS, audiences and
    proof aud. Defaults to https://<Certify Hostname>.
  type: string
  label: Certify Domain URL
  group: General

- variable: certify.image.tag
  description: Inji Certify image tag
  type: string
  label: Certify Image Tag
  default: "0.14.0"
  group: General

# ── Database ────────────────────────────────────────────────────────────────
- variable: global.postgresqlHost
  description: PostgreSQL server host (installed separately)
  type: string
  label: PostgreSQL Host
  default: commons-postgresql
  group: Database

- variable: postgres-init.enabled
  description: Run the postgres-init job to create Certify's DB and user
  type: boolean
  label: Run Postgres Init
  default: true
  group: Database

- variable: dbSchemaInit.enabled
  description: >-
    Run the DB schema-init job (keymanager tables, key policies, credential_config).
    Required on first install.
  type: boolean
  label: Run DB Schema Init
  default: true
  group: Database

# NOTE: Issuer DID/key and VC credential_config definitions are NOT set here —
# they are owned by the consuming module (registry/NSR), which registers them
# with Certify. This chart is the generic issuer service.

# ── Keystore (.p12) ───────────────────────────────────────────────────────────
- variable: certify.p12.enabled
  description: Mount a PKCS12 keystore (the issuer identity)
  type: boolean
  label: Mount .p12 Keystore
  default: true
  group: Keystore

- variable: certify.p12.existingSecret
  description: Name of the Secret holding the .p12 keystore
  type: string
  label: .p12 Secret Name
  group: Keystore
  show_if: "certify.p12.enabled=true"
