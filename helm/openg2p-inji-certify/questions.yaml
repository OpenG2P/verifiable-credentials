questions:

# ── General ─────────────────────────────────────────────────────────────────
- variable: certify.enabled
  description: Install the Inji Certify service
  type: boolean
  label: Inji Certify Service
  default: true
  group: General

- variable: global.certifyHostname
  description: Hostname under which Certify is accessed (e.g. certify.example.org)
  type: string
  label: Certify Hostname
  group: General

- variable: global.certifyDomainUrl
  description: >-
    Public base URL of Certify — used as the token issuer, JWKS, audiences and
    proof aud. Defaults to https://<Certify Hostname>.
  type: string
  label: Certify Domain URL
  group: General

- variable: certify.image.tag
  description: Inji Certify image tag
  type: string
  label: Certify Image Tag
  default: "0.14.0"
  group: General

# ── Database ────────────────────────────────────────────────────────────────
- variable: global.postgresqlHost
  description: PostgreSQL server host (installed separately)
  type: string
  label: PostgreSQL Host
  default: commons-postgresql
  group: Database

- variable: postgres-init.enabled
  description: Run the postgres-init job to create Certify's DB and user
  type: boolean
  label: Run Postgres Init
  default: true
  group: Database

- variable: dbSchemaInit.enabled
  description: >-
    Run the DB schema-init job (keymanager tables, key policies, credential_config).
    Required on first install.
  type: boolean
  label: Run DB Schema Init
  default: true
  group: Database

# ── Issuer (ENV-LEVEL — one issuer/authority per environment) ─────────────────
# Only the issuer IDENTITY is set here. The VC credential_config DEFINITIONS
# (templates / types / fields) are owned by the consuming module (registry/NSR),
# which references this issuer when registering them.
- variable: global.vcIssuerDid
  description: >-
    Issuer DID — identifies the credential issuer (the VC `issuer`). One per
    environment. (Phase 2 only: publish did.json at this URL; Phase-1 paper
    verification uses a pre-distributed trust anchor instead.)
  type: string
  label: Issuer DID
  group: Issuer

# ── Keystore (.p12) ───────────────────────────────────────────────────────────
- variable: certify.p12.enabled
  description: >-
    Keep the signing keystore (local.p12) on durable storage. LEAVE THIS ON.
    The keystore is the issuer identity: together with the encrypted key rows in
    PostgreSQL it is what every credential is signed with. Switched off, Certify
    still generates a keystore but only inside the container, so a new one is
    created on every restart — which makes the key rows in the database
    undecryptable and every credential already issued unverifiable. There is no
    recovery from that.
  type: boolean
  label: Persist the signing keystore
  default: true
  group: Keystore

- variable: certify.p12.existingSecret
  description: >-
    LEAVE BLANK for a new install — Certify then generates the keystore on first
    boot and stores it on its own persistent volume. Only fill this in to RESTORE
    a previously backed-up issuer identity: give the name of a Secret holding the
    keystore under the key `local.p12`. When set, that Secret is mounted
    read-only and no volume is created, so the restored identity is used as-is.
  type: string
  label: Restore from existing .p12 Secret (optional)
  group: Keystore
  show_if: "certify.p12.enabled=true"
