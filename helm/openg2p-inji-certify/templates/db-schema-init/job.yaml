{{- if .Values.dbSchemaInit.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-certify-db-init
  labels:
    app.kubernetes.io/name: certify-db-init
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    # Runs after postgres-init (which creates the DB/user) but before Certify
    # starts, so the keymanager tables + credential_config exist on first boot.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.dbSchemaInit.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.dbSchemaInit.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: certify-db-init
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: certify-db-init
    spec:
      restartPolicy: Never
      containers:
        - name: certify-db-init
          image: {{ .Values.dbSchemaInit.image.repository }}:{{ .Values.dbSchemaInit.image.tag }}
          imagePullPolicy: {{ .Values.dbSchemaInit.image.pullPolicy }}
          env:
            - name: PGHOST
              value: {{ tpl .Values.global.postgresqlHost $ | quote }}
            - name: PGPORT
              value: {{ .Values.global.certifyDBPort | quote }}
            - name: PGDATABASE
              value: {{ tpl .Values.global.certifyDB $ | quote }}
            - name: PGUSER
              value: {{ tpl .Values.global.certifyDBUser $ | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.global.certifyDBSecret $ | quote }}
                  key: {{ tpl .Values.global.certifyDBUserPasswordKey $ | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"; do
                echo "waiting for $PGDATABASE ..."; sleep 3;
              done
              for f in $(ls /sql/*.sql | sort); do
                echo "Applying $f";
                psql -v ON_ERROR_STOP=1 -f "$f";
              done
              echo "Certify DB schema init complete."
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
      volumes:
        - name: sql
          configMap:
            name: {{ .Release.Name }}-certify-db-init-sql
{{- end }}
