{{- if .Values.dbSchemaInit.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-certify-db-init-sql
  labels:
    app.kubernetes.io/name: certify-db-init
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
data:
  # Certify base schema only (keymanager tables, key_policy_def) — version-specific,
  # shipped verbatim from the chart's files/db-init/. This chart is GENERIC: it does
  # NOT seed any credential_config. The consuming MODULE (registry/NSR) owns and
  # registers its VC definitions (see the registry chart's credential-config-register
  # Job and registry-data-connector docs).
  01-certify-init.sql: |-
{{ .Files.Get "files/db-init/01-certify-init.sql" | indent 4 }}
{{- end }}
