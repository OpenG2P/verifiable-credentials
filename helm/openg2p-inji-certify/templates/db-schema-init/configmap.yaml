{{- if .Values.dbSchemaInit.enabled }}
{{- $c := .Values.certify -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-certify-db-init-sql
  labels:
    app.kubernetes.io/name: certify-db-init
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
data:
  # 1) Certify base schema (keymanager tables, key_policy_def) — version-specific,
  #    shipped verbatim from the chart's files/db-init/.
  01-certify-init.sql: |-
{{ .Files.Get "files/db-init/01-certify-init.sql" | indent 4 }}
{{- if .Values.dbSchemaInit.seedDemoCredential }}
  # 2) (DEMO/standalone only) An example credential_config rendered from chart
  #    values. In production the MODULE (registry/NSR) owns and seeds its VC
  #    definitions — keep dbSchemaInit.seedDemoCredential=false there so Certify
  #    stays generic.
  02-openg2p-credential-config.sql: |-
    INSERT INTO certify.credential_config (
        credential_config_key_id, config_id, status, vc_template, doctype, sd_jwt_vct,
        context, credential_type, credential_format, did_url, key_manager_app_id,
        key_manager_ref_id, signature_algo, signature_crypto_suite, sd_claim, display,
        display_order, scope, cryptographic_binding_methods_supported,
        credential_signing_alg_values_supported, proof_types_supported, credential_subject,
        mso_mdoc_claims, plugin_configurations, credential_status_purpose, qr_settings,
        qr_signature_algo, cr_dtimes, upd_dtimes
    ) VALUES (
        '{{ $c.credentialConfig.id }}',
        gen_random_uuid()::VARCHAR(255),
        'active',
        '{{ $c.credentialConfig.vcTemplateB64 }}',
        NULL,
        NULL,
        'https://www.w3.org/2018/credentials/v1',
        '{{ $c.credentialConfig.credentialType }}',
        'ldp_vc',
        '{{ $c.issuer.did }}',
        '{{ $c.issuer.keyAppId }}',
        '{{ $c.issuer.keyRefId }}',
        '{{ $c.issuer.signatureAlgo }}',
        '{{ $c.issuer.signatureCryptoSuite }}',
        NULL,
        '[{"name": "OpenG2P Beneficiary Credential", "locale": "en", "background_color": "#0b6e4f", "text_color": "#FFFFFF"}]'::JSONB,
        ARRAY['functionalRecordId', 'fullName', 'dateOfBirth'],
        '{{ $c.credentialConfig.scope }}',
        ARRAY['did:jwk'],
        ARRAY['{{ $c.issuer.signatureCryptoSuite }}'],
        '{"jwt": {"proof_signing_alg_values_supported": ["RS256", "ES256"]}}'::JSONB,
        '{"functionalRecordId": {"display": [{"name": "Functional Record ID", "locale": "en"}]}, "fullName": {"display": [{"name": "Full Name", "locale": "en"}]}, "dateOfBirth": {"display": [{"name": "Date of Birth", "locale": "en"}]}}'::JSONB,
        NULL,
        NULL,
        NULL,
        '[{"Full Name": "${fullName}", "Functional ID": "${functionalRecordId}", "Date Of Birth": "${dateOfBirth}"}]'::JSONB,
        '{{ $c.issuer.signatureAlgo }}',
        NOW(),
        NULL
    ) ON CONFLICT DO NOTHING;
{{- end }}
{{- end }}
