{{- if .Values.certify.enabled }}
{{- $values := .Values.certify -}}
{{- $context := dict "Values" (merge (deepCopy $values) (dict "global" .Values.global)) "Chart" .Chart "Release" .Release "Files" .Files "Capabilities" .Capabilities -}}
{{- with $context -}}
{{- if and .Values.p12.enabled .Values.p12.backupToSecret.enabled (not .Values.p12.existingSecret) }}
{{- /*
  Lets the keystore-backup sidecar write ONE Secret in this namespace.

  Scoped to the single Secret it maintains via resourceNames, so the token this
  grants cannot read or rewrite anything else. `create` cannot be restricted by
  resourceName (Kubernetes evaluates create before the object name is known),
  which is why it sits in its own rule.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "common.names.fullname" . }}-p12-backup
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ tpl .Values.p12.backupToSecret.secretName . | quote }}
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "common.names.fullname" . }}-p12-backup
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "common.names.fullname" . }}-p12-backup
subjects:
  - kind: ServiceAccount
    name: {{ include "certify.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end -}}
{{- end }}
