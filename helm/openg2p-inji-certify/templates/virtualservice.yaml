{{- if and .Values.certify.enabled .Values.certify.istio.enabled .Values.istio.virtualservice.enabled }}
{{- $host := include "common.tplvalues.render" (dict "value" .Values.istio.virtualservice.host "context" .) }}
{{- $gateway := .Values.istio.virtualservice.gateway }}
{{- $backendCtx := dict "Values" (merge (deepCopy .Values.certify) (dict "global" .Values.global)) "Chart" .Chart "Release" .Release "Files" .Files "Capabilities" .Capabilities -}}
{{- $backendName := include "common.names.fullname" $backendCtx -}}
{{- $backendPort := .Values.certify.service.port -}}
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ .Release.Name }}-certify
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" .) | nindent 4 }}
spec:
  hosts:
    - {{ $host | quote }}
  gateways:
    - {{ $gateway }}
  http:
    {{- if .Values.istio.virtualservice.exposeDidDocument }}
    {{- /*
      did:web resolution. `did:web:<host>` is defined to resolve to
      https://<host>/.well-known/did.json, but Certify serves the document under
      its servlet path at /v1/certify/.well-known/did.json. Without this rewrite
      the issuer DID stamped into every credential does not resolve at all, and
      a verifier cannot fetch the key to check the proof -- the credential still
      LOOKS fine, it just cannot be verified by anyone.

      The SAME applies to the JWKS, for the QR rather than the credential. The
      printed QR is a claim-169 CWT whose `iss` is the plain issuer URL, not a
      DID, and whose COSE `kid` names the ES256 key -- so a verifier resolves
      https://<host>/.well-known/jwks.json. Certify serves that only under its
      servlet path too, and the ES256 key appears ONLY there: the DID document
      is built from credential_config.signature_algo, which is the credential's
      EdDSA, never the QR's ES256. Without this rewrite the one signature anyone
      checks on paper cannot be verified at all.

      Listed before the /v1/certify rule because Istio evaluates http routes in
      order and takes the first match.
    */}}
    - name: certify-did-document
      match:
        - uri:
            exact: /.well-known/did.json
      rewrite:
        uri: /v1/certify/.well-known/did.json
      headers:
        request:
          set:
            x-forwarded-host: {{ $host | quote }}
            x-forwarded-proto: https
      route:
        - destination:
            host: {{ $backendName }}
            port:
              number: {{ $backendPort }}
    - name: certify-jwks
      match:
        - uri:
            exact: /.well-known/jwks.json
      rewrite:
        uri: /v1/certify/.well-known/jwks.json
      headers:
        request:
          set:
            x-forwarded-host: {{ $host | quote }}
            x-forwarded-proto: https
      route:
        - destination:
            host: {{ $backendName }}
            port:
              number: {{ $backendPort }}
    {{- end }}
    - name: certify
      match:
        - uri:
            prefix: /v1/certify
      headers:
        request:
          set:
            x-forwarded-host: {{ $host | quote }}
            x-forwarded-proto: https
      route:
        - destination:
            host: {{ $backendName }}
            port:
              number: {{ $backendPort }}
{{- end }}
