global:
  certifyHostname: 'certify.trial.openg2p.org'
  # Public base URL of this Certify (used as token issuer / JWKS / audiences).
  # Must match the host clients use, so the proof `aud` resolves correctly.
  certifyDomainUrl: 'https://{{ tpl .Values.global.certifyHostname $ }}'

  # ── VC issuer (ENV-LEVEL — one issuer/authority per environment) ──────────
  # Configured at Certify install. The signing keypair is generated by Certify's
  # keymanager on first boot (key alias = CERTIFY_VC_SIGN_ED25519, from
  # key_policy_def). This DID is the issuer identity stamped onto credentials;
  # modules reference it (via the same env value) when registering their
  # credential_configs — they do NOT define the issuer.
  vcIssuerDid: 'did:web:certify.trial.openg2p.org'

  # Database (provisioned by the postgres-init subchart; server installed separately).
  postgresqlHost: commons-postgresql
  certifyDB: '{{ printf "%s" .Release.Name | replace "-" "_" }}'
  certifyDBPort: 5432
  certifyDBUser: '{{ printf "%s_user" .Release.Name | replace "-" "_" }}'
  certifyDBSecret: '{{ .Release.Name }}'
  certifyDBUserPasswordKey: '{{ .Release.Name }}-db-user'

# ---------------------------------------------------------------------------
# postgres-init — creates the Certify DB + least-privilege user on the
# already-installed PostgreSQL. (Schema/tables are seeded by dbSchemaInit below.)
# ---------------------------------------------------------------------------
postgres-init:
  enabled: true
  postgresql:
    host: '{{ .Values.global.postgresqlHost }}'
    port: 5432
    existingSecret: commons-postgresql
    existingSecretPostgresPasswordKey: postgres-password
  databases:
    - name: '{{ tpl .Values.global.certifyDB $ }}'
      user: '{{ tpl .Values.global.certifyDBUser $ }}'
      secret: '{{ tpl .Values.global.certifyDBSecret $ }}'
      secretUserPasswordKey: '{{ tpl .Values.global.certifyDBUserPasswordKey $ }}'

# ---------------------------------------------------------------------------
# dbSchemaInit — Helm hook Job that applies Certify's DB scripts (keymanager
# tables, key_policy_def, credential_config) + the OpenG2P credential_config
# to the freshly-created DB. SQL lives in files/db-init/*.sql.
#   NOTE: review files/db-init/*.sql against your Certify image version.
# ---------------------------------------------------------------------------
dbSchemaInit:
  enabled: true
  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: IfNotPresent
  backoffLimit: 4
  ttlSecondsAfterFinished: 300

# ---------------------------------------------------------------------------
# Certify service
# ---------------------------------------------------------------------------
certify:
  enabled: true
  # Resource name = <release>-inji-certify (e.g. commons-services-inji-certify),
  # which is also the in-cluster service host other components target.
  nameOverride: inji-certify
  hostname: '{{ tpl .Values.global.certifyHostname $ }}'

  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  updateStrategy:
    type: RollingUpdate
  serviceAccount:
    # Created by default so the keystore-backup sidecar's Secret-write
    # permission lands on a ServiceAccount that is Certify's alone. With
    # create=false the pod runs as the namespace `default` SA, and the
    # RoleBinding would hand that permission to every other pod in the
    # namespace that does not set its own.
    create: true
    name: ""
  image:
    repository: injistack/inji-certify-with-plugins
    tag: "0.14.0"
    pullPolicy: IfNotPresent
  podSecurityContext:
    enabled: false
  containerSecurityContext:
    enabled: false

  service:
    type: ClusterIP
    port: 80
    externalTrafficPolicy: Cluster

  istio:
    enabled: true
    gateway:
      enabled: false

  # ---- PKCS12 keystore (the issuer identity; no HSM) -----------------------
  # Mount an existing Secret holding the .p12. Persist + back it up — the .p12
  # plus the encrypted key rows ARE the issuer identity. Disable if your image
  # generates/loads keys another way.
  p12:
    enabled: true
    mountPath: /home/inji/CERTIFY_PKCS12
    # Mode A (default — fresh install): generate the keystore on first boot onto a
    # DURABLE PVC. local.p12 is the issuer master key; it MUST persist. An
    # emptyDir would mint a new master key on every pod recreation, which would
    # make the encrypted keymanager key rows in Postgres undecryptable and
    # invalidate every previously issued credential. Back this PVC up TOGETHER
    # with the keymanager key rows in Postgres (they are one identity).
    persistence:
      enabled: true
      existingClaim: ""
      storageClass: ""
      accessModes:
        - ReadWriteOnce
      size: 64Mi
    # Mode B (restore): mount a backed-up keystore from a Secret (read-only).
    # When set, this takes precedence over persistence above and no PVC is used.
    # The Secret must carry the keystore file under the key `local.p12`.
    existingSecret: ""

    # Mode A companion: copy the generated keystore into a Secret, so the issuer
    # identity is included in whatever backs up this namespace rather than
    # living only on a PVC that most backup tooling skips. Losing it makes every
    # credential ever issued unverifiable, so this is ON by default.
    #
    # Not used in Mode B: restoring from existingSecret means a Secret already
    # holds it, and re-copying would write over the source.
    backupToSecret:
      enabled: true
      secretName: '{{ include "common.names.fullname" . }}-p12-backup'
      fileName: local.p12
      # Needs kubectl only, to apply the one Secret named above.
      # NOT a bitnami image: Bitnami withdrew its free Docker Hub images, so
      # bitnami/kubectl no longer resolves and the sidecar ImagePullBackOffs.
      image: alpine/k8s:1.31.0
      intervalSeconds: 60
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi

  # NOTE on ownership:
  #  • Issuer (DID + signing key) = ENV-LEVEL, set HERE at Certify install
  #    (global.vcIssuerDid above; key alias via key_policy_def). One per env.
  #  • VC `credential_config` DEFINITIONS (templates / types / fields / scope) =
  #    MODULE-owned — the registry/NSR registers them with Certify and references
  #    this env issuer. This chart does NOT seed any credential_config.

  # ---- Spring property overrides (rendered to the -config ConfigMap) -------
  appConfig:
    domainUrl: '{{ tpl .Values.global.certifyDomainUrl $ }}'
    # Built-in plugin: pushed /pre-authorized-data claims become the VC subject.
    dataProviderPlugin: PreAuthDataProviderPlugin
    # How long an issued credential stays valid, as an ISO-8601 duration.
    # This is what fills ${validUntil} in the credential template; Certify's own
    # default is P730D (two years) and was previously invisible here.
    #
    # NOTE: Certify applies this per DEPLOYMENT, not per credential type -- the
    # property is read once by the data-provider plugin. A registry that needs a
    # different validity per credential (say a 1-year farmer card and a 5-year
    # identity card) cannot express that today; it needs per-credential_config
    # support upstream in Certify.
    vcExpiryDuration: P730D
    # Package Spring @ComponentScans for the plugin beans. The bundled plugins
    # (PreAuthDataProviderPlugin, MockVCIssuancePlugin, LoggerAuditService) live in
    # this package inside the inji-certify-with-plugins image. REQUIRED — it is
    # resolved during configuration parsing, so an unset value fails startup with
    # "Could not resolve placeholder 'mosip.certify.integration.scan-base-package'".
    scanBasePackage: io.mosip.certify.mock.integration
    # Audit plugin bean (also in the package above).
    auditPlugin: LoggerAuditService
    # VC-issuance plugin. EMPTY ON PURPOSE.
    #
    # In plugin-mode=DataProvider (what we run) Certify fetches claims via the
    # data-provider plugin and renders the credential from the Velocity template
    # itself — a VCIssuancePlugin is only used in plugin-mode=VCIssuance, where
    # the plugin returns the whole VC.
    #
    # Naming one here instantiates it: the upstream demo profile sets
    # MockVCIssuancePlugin, whose bean then demands
    # mosip.certify.mock.vciplugin.verification-method and fails startup without
    # it. Loading a *mock* issuance plugin in a real deployment is undesirable
    # anyway. Set this only if you switch to plugin-mode=VCIssuance with a real
    # plugin, and supply that plugin's own properties via extraProperties.
    vciPlugin: ""
    # Human-readable name of the ISSUING AUTHORITY (the department or agency).
    # Certify requires this — it is published in the issuer metadata and is what a
    # wallet or verifier shows as "issued by". One entry per locale.
    issuerDisplay:
      - name: "OpenG2P"
        locale: en

    cacheNames: "userinfo,vcissuance,certificatedatacache,credentialConfig,renderTemplate,jwks,preAuthCodeCache,asMetadataCache,credentialOfferCache"
    # Free-form extra .properties lines appended verbatim (e.g. qr settings,
    # status-list, signature algos). Keep env-specific tuning here.
    extraProperties: ""

  # ---- Environment ---------------------------------------------------------
  # NOTE on config sourcing: the injistack image normally pulls base config
  # from a Spring Cloud Config server. This chart layers the Phase-1 overrides
  # via SPRING_CONFIG_ADDITIONAL_LOCATION. If your image has NO bundled
  # defaults, also point it at your config-server (SPRING_CLOUD_CONFIG_URI) or
  # extend the ConfigMap to carry the full property set. Validate per env.
  envVars:
    SPRING_CONFIG_NAME: certify
    active_profile_env: default
    SPRING_CONFIG_ADDITIONAL_LOCATION: 'file:/home/mosip/config/'
    mosip_certify_domain_url: '{{ tpl .Values.global.certifyDomainUrl $ }}'
    # Plugin loader path — stock image dirs (no custom jar needed for Phase 1).
    loader_path_env: '/home/inji/additional_jars/,/home/mosip/additional_jars'

  envVarsFrom:
    SPRING_DATASOURCE_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.certifyDBSecret $ }}'
        key: '{{ tpl .Values.global.certifyDBUserPasswordKey $ }}'

  startupProbe:
    enabled: true
    httpGet:
      path: /v1/certify/.well-known/jwks.json
      port: http
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60
    successThreshold: 1
  livenessProbe:
    enabled: true
    httpGet:
      path: /v1/certify/.well-known/jwks.json
      port: http
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    httpGet:
      path: /v1/certify/.well-known/jwks.json
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  postgresCheckerInit:
    enabled: true
    image:
      repository: postgres
      tag: "15-alpine"
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    - 'until pg_isready -h "${DB_HOST}" -p "${DB_PORT}" -U "${DB_USER}" -d "${DB_NAME}"; do echo "Waiting for database ${DB_NAME}..."; sleep 3; done'
    containerSecurityContext:
      enabled: false

  # postgres-checker env (separate from the main app env above)
  envVarsChecker:
    DB_HOST: '{{ .Values.global.postgresqlHost }}'
    DB_PORT: '{{ .Values.global.certifyDBPort }}'
    DB_NAME: '{{ tpl .Values.global.certifyDB $ }}'
    DB_USER: '{{ tpl .Values.global.certifyDBUser $ }}'

  containerPort: 8090

# ---------------------------------------------------------------------------
# Istio routing — one VirtualService, one route: /v1/certify → Certify service.
# ---------------------------------------------------------------------------
istio:
  virtualservice:
    # Serve the DID document at /.well-known/did.json by rewriting to Certify's
    # own /v1/certify/.well-known/did.json. Required for did:web to resolve.
    exposeDidDocument: true
    enabled: true
    host: '{{ tpl .Values.global.certifyHostname $ }}'
    gateway: "internal"
